<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gravações HDCAM</title>
<style>body{font:16px system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#202124;background:#fafafa}select,button,input{font:inherit}select{width:100%;padding:.6rem}button{padding:.6rem 1rem}img{display:block;max-width:100%;max-height:60vh;margin:1rem 0;background:#222}input[type=range]{width:100%}audio{display:block;max-width:100%;margin:1rem 0}label{display:block;margin:1rem 0 .3rem}a{color:#1651a0}:focus-visible{outline:3px solid #1651a0;outline-offset:3px}</style>
<a href="/">Início</a><h1>Gravações</h1><p>Segmentos concluídos. O tempo indica a chegada dos dados ao computador; o áudio tem sincronização aproximada.</p>
<label for="segments">Data · duração · tamanho</label><select id="segments"><option value="">Carregando…</option></select>
<p id="status" role="status" aria-live="polite"></p><img id="frame" alt="Quadro da gravação" hidden>
<button id="play" disabled>Reproduzir</button><label for="seek">Posição <output id="position">0:00</output></label><input id="seek" type="range" min="0" max="0" value="0" step="1" disabled>
<audio id="audio" controls hidden></audio><a id="download" hidden download="audio.wav">Baixar áudio WAV</a>
<script src="/recordings/app.js" defer></script></html>
